name: Publish NuGet Packages

on:
  push:
    tags:
      - "v*"
      - "core-v*"
      - "http-v*"
      - "sockets-v*"
      - "websockets-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve release target
        id: release
        run: |
          ref="${GITHUB_REF_NAME}"
          props_version="$(grep -oE '<Version>[^<]+</Version>' Directory.Build.props | head -1 | sed -E 's#</?Version>##g')"
          all="src/FIO/FIO.fsproj src/FIO.Sockets/FIO.Sockets.fsproj src/FIO.WebSockets/FIO.WebSockets.fsproj src/FIO.Http/FIO.Http.fsproj"
          mode=""; version=""; projects=""; pack_arg=""

          # Only a tag names a release; a dispatch on a branch is a dry run of the lockstep pack.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            mode="manual"; projects="$all"
          else
            case "$ref" in
              core-v*)       version="${ref#core-v}";       mode="core";      projects="src/FIO/FIO.fsproj";                       pack_arg="-p:Version=${version}" ;;
              http-v*)       version="${ref#http-v}";       mode="extension"; projects="src/FIO.Http/FIO.Http.fsproj";             pack_arg="-p:PackageReleaseVersion=${version}" ;;
              sockets-v*)    version="${ref#sockets-v}";    mode="extension"; projects="src/FIO.Sockets/FIO.Sockets.fsproj";       pack_arg="-p:PackageReleaseVersion=${version}" ;;
              websockets-v*) version="${ref#websockets-v}"; mode="extension"; projects="src/FIO.WebSockets/FIO.WebSockets.fsproj"; pack_arg="-p:PackageReleaseVersion=${version}" ;;
              v*)            version="${ref#v}";            mode="lockstep";  projects="$all";                                     pack_arg="-p:Version=${version}" ;;
              *)
                echo "::error::Tag '$ref' matches no release pattern (v*, core-v*, http-v*, sockets-v*, websockets-v*)."
                exit 1 ;;
            esac
          fi

          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version' parsed from tag '$ref'."
            exit 1
          fi

          if [[ "$mode" == "lockstep" || "$mode" == "core" ]]; then
            if [[ "$version" != "$props_version" ]]; then
              echo "::error::Tag version '$version' does not match Directory.Build.props <Version> '$props_version'. Bump the baseline version to match the tag before a core/lockstep release."
              exit 1
            fi
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi

          {
            echo "prerelease=$prerelease"
            echo "projects=$projects"
            echo "pack_arg=$pack_arg"
          } >> "$GITHUB_OUTPUT"
          echo "Release mode: ${mode} | version: ${version:-<props default>} | projects: ${projects}"

      - name: Restore dependencies
        run: dotnet restore ./FIO.slnx

      - name: Build Release
        run: dotnet build -c Release --no-restore ./FIO.slnx

      - name: Run tests
        run: >
          dotnet test -c Release --no-build --verbosity normal ./FIO.slnx
          --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Pack NuGet packages
        env:
          PROJECTS: ${{ steps.release.outputs.projects }}
          PACK_ARG: ${{ steps.release.outputs.pack_arg }}
        run: |
          # The packed assemblies grant no friend access: the test projects' InternalsVisibleTo is left out.
          for proj in $PROJECTS; do
            dotnet pack "$proj" -c Release $PACK_ARG -p:StripInternals=true -o ./nupkgs
          done

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg

  # Only a pushed tag publishes; a manual run, on a branch or on a tag, is a dry run that stops after packing. This job
  # runs none of the repository's code, so only it holds the release permissions. Trusted publishing: NuGet/login swaps
  # the job's OIDC token for a short-lived API key, and the nuget.org policy names this repository, this file
  # (publish.yml) and the production environment, so renaming any of them breaks publishing.
  publish:
    needs: pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: iyyel

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ needs.pack.outputs.prerelease == 'true' }}
          files: ./nupkgs/*.nupkg
