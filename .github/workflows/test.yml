name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    env:
      FIO_RUN_STRESS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./FIO.slnx

      - name: Build
        run: dotnet build --no-restore ./FIO.slnx

      - name: Run tests
        run: >
          dotnet test --no-build --verbosity normal ./FIO.slnx
          --logger "trx;LogFilePrefix=${{ matrix.os }}"
          --results-directory ./test-results
          --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results/*.trx
          if-no-files-found: warn

  # Release is what ships, and F# compiles task { } into state machines only in optimized builds: this job tests that
  # code, on x64 and on ARM64, and it is where the interpreter JIT-limit guard (InterpreterSizeTests) runs, since Debug
  # builds skip it.
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    env:
      FIO_RUN_STRESS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./FIO.slnx

      - name: Build (Release)
        run: dotnet build -c Release --no-restore ./FIO.slnx

      - name: Run tests (Release)
        run: >
          dotnet test -c Release --no-build --verbosity normal ./FIO.slnx
          --logger "trx;LogFilePrefix=release-${{ matrix.os }}"
          --results-directory ./test-results
          --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-release-${{ matrix.os }}
          path: ./test-results/*.trx
          if-no-files-found: warn
