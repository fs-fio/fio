name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# The job that runs the benchmark code, which a pull request controls, gets a read-only token; only the tracking job,
# which runs no code from the repository, may push the dashboard and comment.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./FIO.slnx

      - name: Smoke test (all benchmarks × all runtimes, tiny params — fail fast on hang/throw)
        timeout-minutes: 10
        env:
          FIO_BENCH_RUNTIMES: "Direct,Polling-2-200-1,Signaling-2-200-1,WorkStealing-2-200-1"
          FIO_BENCH_BANG_ACTORS: "4"
          FIO_BENCH_BANG_ROUNDS: "10"
          FIO_BENCH_BIG_ACTORS: "4"
          FIO_BENCH_BIG_ROUNDS: "5"
          FIO_BENCH_BOUNDEDBUFFER_ITEMS: "200"
          FIO_BENCH_CHAMENEOS_CREATURES: "6"
          FIO_BENCH_CHAMENEOS_MEETINGS: "50"
          FIO_BENCH_COUNTING_MESSAGES: "500"
          FIO_BENCH_FORK_ACTORS: "200"
          FIO_BENCH_PHILOSOPHERS_COUNT: "5"
          FIO_BENCH_PHILOSOPHERS_ROUNDS: "20"
          FIO_BENCH_PINGPONG_ROUNDS: "200"
          FIO_BENCH_THREADRING_ACTORS: "10"
          FIO_BENCH_THREADRING_ROUNDS: "20"
          FIO_BENCH_FIBONACCI_N: "20"
          FIO_BENCH_TRAPEZOIDAL_WORKERS: "2"
          FIO_BENCH_TRAPEZOIDAL_POINTS: "10000"
          FIO_BENCH_ZIPRACE_ROUNDS: "50"
        run: dotnet run -c Release --project benchmarks/FIO.Benchmarks -- --filter "*" --job Dry

      - name: Run Pingpong benchmark (all runtimes)
        timeout-minutes: 20
        env:
          FIO_BENCH_RUNTIMES: "Direct,Polling-2-200-1,Signaling-2-200-1,WorkStealing-2-200-1"
          FIO_BENCH_PINGPONG_ROUNDS: "50000"
          FIO_BENCH_WARMUP: "1"
          FIO_BENCH_ITERATIONS: "5"
        run: |
          dotnet run -c Release --project benchmarks/FIO.Benchmarks -- \
            --filter "*Pingpong*" \
            --exporters json github

      - name: Display benchmark summary
        run: |
          set -euo pipefail
          report_md=$(find BenchmarkDotNet.Artifacts/results -name '*PingpongBenchmark-report-github.md' | head -1)
          if [[ -z "$report_md" ]]; then
            echo "::error::No Pingpong markdown report found under BenchmarkDotNet.Artifacts/results — the benchmark step produced no output."
            exit 1
          fi
          {
            echo "## Benchmark Results — Pingpong"
            echo ""
            echo '```'
            cat "$report_md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Convert results to tracking JSON
        run: |
          set -euo pipefail
          report_json=$(find BenchmarkDotNet.Artifacts/results -name '*PingpongBenchmark-report-full-compressed.json' | head -1)
          if [[ -z "$report_json" ]]; then
            echo "::error::No Pingpong JSON report found under BenchmarkDotNet.Artifacts/results — did the --exporters json flag take effect?"
            exit 1
          fi
          jq '[ .Benchmarks[]
                | { name: ("Pingpong - " + (.Parameters | capture("Runtime=(?<r>[^,&]+)") | .r)),
                    unit: "ms",
                    value: (.Statistics.Mean / 1000000) } ]' "$report_json" > benchmark-results.json
          {
            echo "### Benchmark JSON for tracking:"
            echo '```json'
            cat benchmark-results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: |
            BenchmarkDotNet.Artifacts/results/*Pingpong*
            benchmark-results.json

  track:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download benchmark results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: benchmark-results
          path: ./benchmark-results

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: "customSmallerIsBetter"
          output-file-path: benchmark-results/benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-on-alert: true
          alert-threshold: "150%"
          fail-on-alert: false
          alert-comment-cc-users: "@${{ github.actor }}"
